name: Deploy workshop app to Azure

on:
  workflow_dispatch:
    inputs:
      teamId:
        description: Lowercase team identifier used by the approved Bicep deployment
        required: true
        type: string
      pullRequestNumber:
        description: Pull request whose current same-repository head is selected by --ref
        required: true
        type: number

permissions: {}

concurrency:
  group: workshop-deployment-${{ inputs.teamId }}
  cancel-in-progress: false

jobs:
  validate-linkage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      pull_request_number: ${{ steps.validate.outputs.pull_request_number }}
      required_checks: ${{ steps.validate.outputs.required_checks }}
      security_checks: ${{ steps.validate.outputs.security_checks }}
    steps:
      - name: Validate pull request, commit, and checks
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pullRequestNumber }}
          REPOSITORY: ${{ github.repository }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pullRequestNumber must be a positive integer."
            exit 1
          fi

          pr="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPOSITORY/pulls/$PR_NUMBER"
          )"
          head_sha="$(jq -r '.head.sha' <<< "$pr")"
          head_repository="$(jq -r '.head.repo.full_name // empty' <<< "$pr")"
          if [ "$head_repository" != "$REPOSITORY" ]; then
            echo "::error::Pull request #$PR_NUMBER must use a branch in $REPOSITORY, not $head_repository."
            exit 1
          fi
          if [ "$DEPLOYED_SHA" != "$head_sha" ]; then
            echo "::error::Selected commit $DEPLOYED_SHA is not the current head $head_sha of pull request #$PR_NUMBER."
            exit 1
          fi

          if ! required_checks="$(gh pr checks "$PR_NUMBER" --required \
            --json name,state,workflow,bucket,link)"; then
            echo "::error::One or more required pull-request checks have not passed."
            exit 1
          fi
          if [ "$(jq 'length' <<< "$required_checks")" -eq 0 ]; then
            echo "::error::No required pull-request checks were found. Configure branch protection before deployment."
            exit 1
          fi
          if ! jq -e 'all(.[]; .bucket == "pass")' <<< "$required_checks" >/dev/null; then
            echo "::error::Every required pull-request check must pass before deployment."
            exit 1
          fi

          all_checks="$(gh pr checks "$PR_NUMBER" --json name,state,workflow,bucket,link)"
          security_checks="$(
            jq -c '
              [.[] | select(
                ((.workflow // "") | test("codeql|dependency review"; "i")) or
                ((.name // "") | test("codeql|dependency review|analyze javascript"; "i"))
              )]
            ' <<< "$all_checks"
          )"
          if [ "$(jq 'length' <<< "$security_checks")" -gt 0 ] &&
            ! jq -e 'all(.[]; .bucket == "pass")' <<< "$security_checks" >/dev/null; then
            echo "::error::A security check is pending or failed."
            exit 1
          fi

          required_summary="$(
            jq -c '{
              status: "passed",
              count: length,
              checks: map({name, workflow, state})
            }' <<< "$required_checks"
          )"
          security_summary="$(
            jq -c '{
              status: (if length == 0 then "not_run" else "passed" end),
              count: length,
              checks: map({name, workflow, state})
            }' <<< "$security_checks"
          )"
          echo "pull_request_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "required_checks=$required_summary" >> "$GITHUB_OUTPUT"
          echo "security_checks=$security_summary" >> "$GITHUB_OUTPUT"

  deploy:
    needs: validate-linkage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: workshop
      url: ${{ steps.infrastructure.outputs.application_url }}
    outputs:
      application_url: ${{ steps.infrastructure.outputs.application_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
      - name: Validate deployment inputs and OIDC configuration
        id: validate-inputs
        shell: bash
        env:
          TEAM_ID: ${{ inputs.teamId }}
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WORKSHOP_ALLOWED_CIDRS: ${{ vars.WORKSHOP_ALLOWED_CIDRS }}
        run: |
          set -euo pipefail
          if ! [[ "$TEAM_ID" =~ ^[a-z0-9][a-z0-9-]{1,18}[a-z0-9]$ ]]; then
            echo "::error::teamId must be 3-20 lowercase letters, digits, or internal hyphens."
            exit 1
          fi
          for name in CLIENT_ID TENANT_ID SUBSCRIPTION_ID RESOURCE_GROUP; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing environment variable $name. Configure OIDC and the protected workshop environment."
              exit 1
            fi
          done
          cidrs_json="$(
            python -c '
          import ipaddress
          import json
          import os
          import sys

          raw = os.environ.get("WORKSHOP_ALLOWED_CIDRS", "").strip()
          if not raw:
              print("::error::Missing WORKSHOP_ALLOWED_CIDRS. Set the instructor-approved CIDR allowlist in the workshop environment.", file=sys.stderr)
              sys.exit(1)
          try:
              networks = [ipaddress.ip_network(value.strip(), strict=True) for value in raw.split(",")]
              if not 1 <= len(networks) <= 100:
                  raise ValueError("supply between 1 and 100 CIDRs")
          except ValueError as error:
              print(f"::error::WORKSHOP_ALLOWED_CIDRS must be a comma-separated list of valid CIDR network addresses: {error}", file=sys.stderr)
              sys.exit(1)
          print(json.dumps([str(network) for network in networks], separators=(",", ":")))
          '
          )"
          echo "workshop_allowed_cidrs=$cidrs_json" >> "$GITHUB_OUTPUT"
      - name: Build and test application
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm prune --omit=dev
      - name: Create deployment package
        run: zip -r app.zip dist package.json package-lock.json node_modules
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure
        id: infrastructure
        shell: bash
        env:
          TEAM_ID: ${{ inputs.teamId }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WORKSHOP_ALLOWED_CIDRS_JSON: ${{ steps.validate-inputs.outputs.workshop_allowed_cidrs }}
        run: |
          set -euo pipefail
          deployment="$(
            az deployment group create \
              --name "workshop-${GITHUB_RUN_ID}" \
              --resource-group "$RESOURCE_GROUP" \
              --template-file infra/main.bicep \
              --parameters infra/main.example.bicepparam \
                teamIdentifier="$TEAM_ID" \
                workshopAllowedCidrs="$WORKSHOP_ALLOWED_CIDRS_JSON" \
              --output json
          )"
          app_name="$(jq -r '.properties.outputs.appName.value // empty' <<< "$deployment")"
          app_url="$(jq -r '.properties.outputs.appUrl.value // empty' <<< "$deployment")"
          deployment_name="$(jq -r '.name // empty' <<< "$deployment")"
          if [ -z "$app_name" ] || [ -z "$app_url" ] || [ -z "$deployment_name" ]; then
            echo "::error::Azure deployment must return its name and Bicep outputs appName and appUrl."
            exit 1
          fi
          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
          echo "application_url=${app_url%/}" >> "$GITHUB_OUTPUT"
          echo "deployment_name=$deployment_name" >> "$GITHUB_OUTPUT"
      - name: Deploy application package
        run: >
          az webapp deploy
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --name "${{ steps.infrastructure.outputs.app_name }}"
          --src-path app.zip
          --type zip
          --clean true
          --restart true
      - name: Temporarily allow this runner for smoke verification
        id: runner-access
        shell: bash
        env:
          APP_NAME: ${{ steps.infrastructure.outputs.app_name }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WORKSHOP_ALLOWED_CIDRS_JSON: ${{ steps.validate-inputs.outputs.workshop_allowed_cidrs }}
        run: |
          set -euo pipefail
          runner_ip="$(curl --fail --silent --show-error --max-time 20 https://api.ipify.org)"
          RUNNER_IP="$runner_ip" WORKSHOP_ALLOWED_CIDRS_JSON="$WORKSHOP_ALLOWED_CIDRS_JSON" \
            python -c '
          import ipaddress
          import json
          import os
          import sys

          try:
              runner = ipaddress.ip_address(os.environ["RUNNER_IP"])
              networks = [ipaddress.ip_network(value) for value in json.loads(os.environ["WORKSHOP_ALLOWED_CIDRS_JSON"])]
              if runner.version != 4:
                  raise ValueError("the smoke-test runner must have an IPv4 egress address")
              if any(runner in network for network in networks):
                  raise ValueError("the runner is already inside the approved workshop allowlist, so outsider denial cannot be verified")
          except ValueError as error:
              print(f"::error::Cannot safely configure or verify temporary runner ingress: {error}", file=sys.stderr)
              sys.exit(1)
          '
          rule_name="github-actions-${GITHUB_RUN_ID}"
          az webapp config access-restriction add \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --rule-name "$rule_name" \
            --priority 2000 \
            --action Allow \
            --ip-address "${runner_ip}/32" \
            --description "Temporary deployment smoke verification run ${GITHUB_RUN_ID}" \
            --output none
          echo "runner_ip=$runner_ip" >> "$GITHUB_OUTPUT"
          echo "runner_rule_name=$rule_name" >> "$GITHUB_OUTPUT"
      - name: Verify deployed health, readiness, and API
        id: verify
        shell: bash
        env:
          APPLICATION_URL: ${{ steps.infrastructure.outputs.application_url }}
        run: |
          set -euo pipefail
          for attempt in {1..36}; do
            if curl --fail --silent --show-error "$APPLICATION_URL/health" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "::error::Deployment health check failed for six minutes."
              exit 1
            fi
            sleep 10
          done
          curl --fail --silent --show-error "$APPLICATION_URL/ready" >/dev/null
          feedback_id="$(
            curl --fail --silent --show-error \
              --request POST \
              --header "Content-Type: application/json" \
              --data "{\"title\":\"Deployment ${GITHUB_RUN_ID}\",\"description\":\"Automated post-deployment verification.\",\"category\":\"facilitation\",\"displayName\":\"GitHub Actions\"}" \
              "$APPLICATION_URL/api/feedback" |
              jq -r '.feedback.id // empty'
          )"
          if [ -z "$feedback_id" ]; then
            echo "::error::Feedback creation smoke test did not return an ID."
            exit 1
          fi
          vote_count="$(
            curl --fail --silent --show-error \
              --request POST \
              --header "Content-Type: application/json" \
              --data "{\"clientId\":\"deployment-${GITHUB_RUN_ID}\"}" \
              "$APPLICATION_URL/api/feedback/$feedback_id/votes" |
              jq -r '.feedback.votes // empty'
          )"
          if [ "$vote_count" != "1" ]; then
            echo "::error::Feedback vote smoke test expected one vote and received '$vote_count'."
            exit 1
          fi
          duplicate_vote="$(
            curl --fail --silent --show-error \
              --request POST \
              --header "Content-Type: application/json" \
              --data "{\"clientId\":\"deployment-${GITHUB_RUN_ID}\"}" \
              "$APPLICATION_URL/api/feedback/$feedback_id/votes"
          )"
          if [ "$(jq -r '.alreadyVoted' <<< "$duplicate_vote")" != "true" ] ||
            [ "$(jq -r '.feedback.votes' <<< "$duplicate_vote")" != "1" ]; then
            echo "::error::Duplicate-vote smoke test did not preserve one vote."
            exit 1
          fi
          echo "health=true" >> "$GITHUB_OUTPUT"
          echo "readiness=true" >> "$GITHUB_OUTPUT"
          echo "feedback_creation=true" >> "$GITHUB_OUTPUT"
          echo "first_vote=true" >> "$GITHUB_OUTPUT"
          echo "duplicate_vote_protection=true" >> "$GITHUB_OUTPUT"
      - name: Remove runner ingress and verify outsider denial
        id: runner-cleanup
        if: ${{ always() && steps.infrastructure.outputs.app_name != '' }}
        shell: bash
        env:
          APPLICATION_URL: ${{ steps.infrastructure.outputs.application_url }}
          APP_NAME: ${{ steps.infrastructure.outputs.app_name }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          rule_name="github-actions-${GITHUB_RUN_ID}"
          rule_count="$(
            az webapp config access-restriction show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_NAME" \
              --query "ipSecurityRestrictions[?name=='${rule_name}'] | length(@)" \
              --output tsv
          )"
          if [ "$rule_count" != "0" ]; then
            az webapp config access-restriction remove \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_NAME" \
              --rule-name "$rule_name" \
              --output none
          fi
          remaining_rules="$(
            az webapp config access-restriction show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_NAME" \
              --query "ipSecurityRestrictions[?name=='${rule_name}'] | length(@)" \
              --output tsv
          )"
          if [ "$remaining_rules" != "0" ]; then
            echo "::error::Temporary runner ingress rule '$rule_name' remains; deployment evidence will not be published."
            exit 1
          fi

          denied_status=""
          for attempt in {1..12}; do
            denied_status="$(
              curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --connect-timeout 5 --max-time 10 "$APPLICATION_URL/health" || true
            )"
            if [ "$denied_status" = "403" ]; then
              break
            fi
            sleep 5
          done
          if [ "$denied_status" != "403" ]; then
            echo "::error::Expected HTTP 403 from outside the workshop allowlist after runner-rule removal; received '$denied_status'."
            exit 1
          fi
          echo "runner_rule_cleanup=true" >> "$GITHUB_OUTPUT"
      - name: Create machine-readable deployment evidence
        id: evidence
        shell: bash
        env:
          APPLICATION_URL: ${{ steps.infrastructure.outputs.application_url }}
          AZURE_DEPLOYMENT: ${{ steps.infrastructure.outputs.deployment_name }}
          PR_NUMBER: ${{ needs.validate-linkage.outputs.pull_request_number }}
          REQUIRED_CHECKS: ${{ needs.validate-linkage.outputs.required_checks }}
          SECURITY_CHECKS: ${{ needs.validate-linkage.outputs.security_checks }}
          HEALTH: ${{ steps.verify.outputs.health }}
          READINESS: ${{ steps.verify.outputs.readiness }}
          FEEDBACK_CREATION: ${{ steps.verify.outputs.feedback_creation }}
          FIRST_VOTE: ${{ steps.verify.outputs.first_vote }}
          DUPLICATE_VOTE_PROTECTION: ${{ steps.verify.outputs.duplicate_vote_protection }}
          RUNNER_RULE_CLEANUP: ${{ steps.runner-cleanup.outputs.runner_rule_cleanup }}
        run: |
          set -euo pipefail
          jq -c -n \
            --arg commit_sha "$GITHUB_SHA" \
            --argjson pull_request_number "$PR_NUMBER" \
            --argjson required_checks "$REQUIRED_CHECKS" \
            --argjson security_checks "$SECURITY_CHECKS" \
            --arg azure_deployment "$AZURE_DEPLOYMENT" \
            --arg github_run_id "$GITHUB_RUN_ID" \
            --arg workflow_run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg environment "workshop" \
            --arg application_url "$APPLICATION_URL" \
            --argjson health "$HEALTH" \
            --argjson readiness "$READINESS" \
            --argjson feedback_creation "$FEEDBACK_CREATION" \
            --argjson first_vote "$FIRST_VOTE" \
            --argjson duplicate_vote_protection "$DUPLICATE_VOTE_PROTECTION" \
            --argjson runner_rule_cleanup "$RUNNER_RULE_CLEANUP" \
            '{
              schema_version: 1,
              commit_sha: $commit_sha,
              pull_request_number: $pull_request_number,
              required_checks: $required_checks,
              security_checks: $security_checks,
              azure: {
                deployment_name: $azure_deployment,
                github_run_id: $github_run_id
              },
              environment: $environment,
              application_url: $application_url,
              verification: {
                health: $health,
                readiness: $readiness,
                feedback_creation: $feedback_creation,
                first_vote: $first_vote,
                duplicate_vote_protection: $duplicate_vote_protection,
                runner_rule_cleanup: $runner_rule_cleanup
              },
              workflow_run_url: $workflow_run_url
            }' > deployment-evidence.json
          jq -e '
            .schema_version == 1 and
            (.commit_sha | test("^[0-9a-f]{40}$")) and
            (.pull_request_number > 0) and
            .required_checks.status == "passed" and
            (.security_checks.status == "passed" or .security_checks.status == "not_run") and
            (.azure.deployment_name | length > 0) and
            .environment == "workshop" and
            (.application_url | test("^https://")) and
            .verification.runner_rule_cleanup == true and
            ([.verification[]] | all) and
            (.workflow_run_url | length > 0)
          ' deployment-evidence.json >/dev/null
      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-pr-${{ needs.validate-linkage.outputs.pull_request_number }}-${{ github.sha }}
          path: deployment-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Summarize verified deployment
        env:
          APPLICATION_URL: ${{ steps.infrastructure.outputs.application_url }}
          PR_NUMBER: ${{ needs.validate-linkage.outputs.pull_request_number }}
        run: |
          {
            echo "## Verified App Service deployment"
            echo "- Pull request: #$PR_NUMBER"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Environment: \`workshop\`"
            echo "- URL: $APPLICATION_URL"
            echo "- Azure deployment: \`${{ steps.infrastructure.outputs.deployment_name }}\`"
            echo "- Health, readiness, feedback, voting, temporary-rule cleanup, and outside-network denial checks passed."
            echo "- Evidence artifact uploaded only after all live checks passed."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload deployment package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-service-package-${{ github.sha }}
          path: app.zip
          if-no-files-found: error
          retention-days: 7

  publish-evidence:
    needs: [validate-linkage, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Download deployment evidence
        uses: actions/download-artifact@v4
        with:
          name: deployment-evidence-pr-${{ needs.validate-linkage.outputs.pull_request_number }}-${{ github.sha }}
          path: deployment-evidence
      - name: Create or update pull-request evidence comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-linkage.outputs.pull_request_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          evidence_path="deployment-evidence/deployment-evidence.json"
          jq -e '.verification | [.[]] | all' "$evidence_path" >/dev/null

          marker="<!-- workshop-deployment-evidence -->"
          application_url="$(jq -r '.application_url' "$evidence_path")"
          commit_sha="$(jq -r '.commit_sha' "$evidence_path")"
          deployment_name="$(jq -r '.azure.deployment_name' "$evidence_path")"
          security_status="$(jq -r '.security_checks.status' "$evidence_path")"
          run_url="$(jq -r '.workflow_run_url' "$evidence_path")"
          body="$marker
          ## Verified deployment evidence
          - Commit: \`$commit_sha\`
          - Environment: \`workshop\`
          - Azure deployment: \`$deployment_name\`
          - Live checks: health, readiness, feedback creation, first vote, duplicate-vote protection, runner-rule cleanup, and outside-network denial passed
          - Security checks: \`$security_status\`
          - Application: $application_url
          - [Workflow run and evidence artifact]($run_url)"

          comment_id="$(
            gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
              --jq ".[] | select(.body | contains(\"$marker\")) | .id" |
              head -n 1
          )"
          payload="$(jq -n --arg body "$body" '{body: $body}')"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" --input - <<< "$payload"
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --input - <<< "$payload"
          fi
